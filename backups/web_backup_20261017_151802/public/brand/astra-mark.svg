<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="astraArrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="astraCyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <radialGradient id="astraAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#070A18" stop-opacity="0" />
    </radialGradient>
    <filter id="astraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="50" cy="50" r="44" fill="url(#astraAura)" />

  <!-- Yantra Orbit Rings -->
  <circle cx="50" cy="50" r="45" stroke="#38BDF8" stroke-width="0.8" opacity="0.4" stroke-dasharray="3 3" />
  <circle cx="50" cy="50" r="39" stroke="#8B5CF6" stroke-width="1.2" opacity="0.6" />
  <circle cx="50" cy="50" r="31" stroke="#22D3EE" stroke-width="0.6" opacity="0.5" />
  
  <!-- Yantra Corner Nodes -->
  <circle cx="50" cy="5" r="2" fill="#38BDF8" />
  <circle cx="50" cy="95" r="2" fill="#38BDF8" />
  <circle cx="5" cy="50" r="2" fill="#8B5CF6" />
  <circle cx="95" cy="50" r="2" fill="#8B5CF6" />
  
  <circle cx="22" cy="22" r="1.5" fill="#F6C87A" opacity="0.8" />
  <circle cx="78" cy="22" r="1.5" fill="#F6C87A" opacity="0.8" />
  <circle cx="22" cy="78" r="1.5" fill="#F6C87A" opacity="0.8" />
  <circle cx="78" cy="78" r="1.5" fill="#F6C87A" opacity="0.8" />

  <!-- The Celestial Arrow / Astral Spear (Yantra Core) -->
  <g filter="url(#astraGlow)">
    <!-- Primary Arrow Tip / Spearhead -->
    <path d="M50 14 L68 54 L50 46 L32 54 Z" fill="url(#astraArrowGrad)" />
    
    <!-- Secondary Outer Arrow Blades -->
    <path d="M50 28 L62 58 L50 52 L38 58 Z" fill="url(#astraCyanGlow)" opacity="0.9" />
    
    <!-- Central Energy Shaft / Light Core -->
    <path d="M50 18 L53 76 L50 84 L47 76 Z" fill="#F7F7FB" />
    <path d="M50 24 L51.5 70 L50 78 L48.5 70 Z" fill="#FFE5A7" />

    <!-- Trailing Fins / Astral Thrusters -->
    <path d="M38 64 L26 82 L38 74 L50 84 Z" fill="#8B5CF6" opacity="0.85" />
    <path d="M62 64 L74 82 L62 74 L50 84 Z" fill="#8B5CF6" opacity="0.85" />

    <!-- Core Fusion Point -->
    <circle cx="50" cy="48" r="3.5" fill="#FFFFFF" />
    <circle cx="50" cy="48" r="1.5" fill="#38BDF8" />
  </g>
</svg>
