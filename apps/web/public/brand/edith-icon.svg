<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="edithIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A182E" />
      <stop offset="50%" stop-color="#050C17" />
      <stop offset="100%" stop-color="#02050A" />
    </linearGradient>
    <linearGradient id="edithIconRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <radialGradient id="edithIconPlasma" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#BAE6FD" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="90%" stop-color="#0284C7" />
    </radialGradient>
    <filter id="edithIconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#edithIconBg)" stroke="url(#edithIconRim)" stroke-width="1.8" />
  <rect x="6" y="6" width="116" height="116" rx="26" stroke="#00D2FF" stroke-width="0.8" opacity="0.3" fill="none" />

  <!-- Ambient Cyan Backlight -->
  <circle cx="64" cy="64" r="42" fill="#0284C7" opacity="0.2" filter="url(#edithIconGlow)" />

  <!-- Cyan Arc Reactor Centered (cx=64, cy=64) -->
  <g>
    <!-- Outer Machined Rings -->
    <circle cx="64" cy="64" r="40" stroke="url(#edithIconRim)" stroke-width="1.5" fill="none" opacity="0.9" />
    <circle cx="64" cy="64" r="36" stroke="#030914" stroke-width="4.5" fill="none" stroke-dasharray="16 4" />
    <circle cx="64" cy="64" r="36" stroke="url(#edithIconRim)" stroke-width="1" fill="none" stroke-dasharray="16 4" />
    <circle cx="64" cy="64" r="28" stroke="url(#edithIconRim)" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.7" />

    <!-- Inner Collar -->
    <circle cx="64" cy="64" r="23" fill="#071322" stroke="url(#edithIconRim)" stroke-width="1.4" />

    <!-- Inverted Triangle Plasma Core -->
    <g filter="url(#edithIconGlow)">
      <polygon points="44,50 84,50 64,84" fill="#030914" stroke="url(#edithIconRim)" stroke-width="2" stroke-linejoin="round" />
      <polygon points="48,52 80,52 64,80" fill="url(#edithIconPlasma)" />
      <polygon points="54,55 74,55 64,73" fill="#FFFFFF" opacity="0.95" />
      <circle cx="64" cy="62" r="4" fill="#FFFFFF" />
    </g>
  </g>
</svg>
