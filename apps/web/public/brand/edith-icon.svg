<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Dark Cosmic Rounded Square Container Gradient -->
    <linearGradient id="sqTileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#070D1E" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Cyan Border Gradient -->
    <linearGradient id="sqTileBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.7" />
    </linearGradient>

    <radialGradient id="sqAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#0369A1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#sqTileBg)" stroke="url(#sqTileBorder)" stroke-width="1.5" />
  
  <!-- Subtle Internal Space Glow -->
  <circle cx="60" cy="60" r="46" fill="url(#sqAura)" />

  <!-- Centered Arc Reactor Emblem (Scaled 0.82) -->
  <g transform="translate(11, 11) scale(0.98)">
    <!-- Nested Arc Reactor via image/path references -->
    <!-- Outer Caliper Orbit -->
    <circle cx="50" cy="50" r="44" stroke="#7DD3FC" stroke-width="0.8" stroke-dasharray="16 5" opacity="0.75" fill="none" />
    <circle cx="50" cy="50" r="40" fill="#0A1628" stroke="#38BDF8" stroke-width="1.2" />
    
    <!-- 10 Segmented Glow Cells -->
    <g>
      <circle cx="50" cy="50" r="38" stroke="#00D2FF" stroke-width="2.5" stroke-dasharray="7 5.56" fill="none" />
      <circle cx="50" cy="50" r="38" stroke="#FFFFFF" stroke-width="0.9" stroke-dasharray="7 5.56" fill="none" opacity="0.85" />
    </g>

    <!-- Inner Armor Collar -->
    <circle cx="50" cy="50" r="28" fill="#040A14" stroke="#7DD3FC" stroke-width="1" />
    <circle cx="50" cy="50" r="24" stroke="#0284C7" stroke-width="0.7" stroke-dasharray="2 3" fill="none" opacity="0.8" />

    <!-- Inverted Triangle Core -->
    <polygon points="31,34.5 69,34.5 50,67.5" fill="#071221" stroke="#38BDF8" stroke-width="1.6" stroke-linejoin="round" />
    <polygon points="34,36.5 66,36.5 50,64" fill="#00D2FF" stroke="#BAE6FD" stroke-width="0.8" stroke-linejoin="round" />
    <polygon points="39,39.5 61,39.5 50,58.5" fill="#FFFFFF" opacity="0.95" />
    <circle cx="50" cy="46" r="3.2" fill="#FFFFFF" />

    <!-- Horizontal Lens Flare Core Beam -->
    <line x1="8" y1="50" x2="92" y2="50" stroke="#BAE6FD" stroke-width="0.8" opacity="0.7" />
    <line x1="24" y1="50" x2="76" y2="50" stroke="#FFFFFF" stroke-width="1.4" opacity="0.95" />
  </g>
</svg>
