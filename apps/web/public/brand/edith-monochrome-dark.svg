<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Segmented Ring -->
  <circle cx="50" cy="50" r="44" stroke="#FFFFFF" stroke-width="1.8" opacity="0.9" />
  <circle cx="50" cy="50" r="40" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="14 4" opacity="0.85" />
  <circle cx="50" cy="50" r="34" stroke="#E0F2FE" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.75" />
  <circle cx="50" cy="50" r="26" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9" />

  <!-- Alignment Notches -->
  <circle cx="50" cy="10" r="1.5" fill="#FFFFFF" />
  <circle cx="90" cy="50" r="1.5" fill="#FFFFFF" />
  <circle cx="50" cy="90" r="1.5" fill="#FFFFFF" />
  <circle cx="10" cy="50" r="1.5" fill="#FFFFFF" />

  <!-- Inverted Triangle Core -->
  <polygon points="30,35 70,35 50,71" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" fill="none" />
  <polygon points="36,38 64,38 50,63" stroke="#BAE6FD" stroke-width="1.2" stroke-linejoin="round" fill="none" />
  <circle cx="50" cy="48" r="3" fill="#FFFFFF" />
</svg>
