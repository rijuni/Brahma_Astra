<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Outer Ring with 3 Radial Notches (Top, Bottom-Right, Bottom-Left) -->
  <circle cx="24" cy="24" r="21" stroke="#0F172A" stroke-width="2.2" opacity="0.95" stroke-dasharray="32 11" stroke-dashoffset="6" />
  
  <!-- 3 Radial Guide Notches -->
  <line x1="24" y1="1" x2="24" y2="5" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" />
  <line x1="43.5" y1="35.5" x2="40" y2="33.5" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" />
  <line x1="4.5" y1="35.5" x2="8" y2="33.5" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" />

  <!-- Inner Concentric Orbit Ring -->
  <circle cx="24" cy="24" r="16.5" stroke="#0F172A" stroke-width="1.2" opacity="0.85" />

  <!-- Central Inverted Triangle Housing & Core -->
  <polygon points="12,17 36,17 24,37" stroke="#0F172A" stroke-width="2" stroke-linejoin="round" fill="none" />
  <polygon points="16,19 32,19 24,33" fill="#0F172A" opacity="0.75" />
  <polygon points="19,20.5 29,20.5 24,29" fill="#0F172A" />
  
  <!-- Center Singularity Spark -->
  <circle cx="24" cy="23.5" r="1.8" fill="#FFFFFF" />
</svg>
