<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 64" fill="none">
  <defs>
    <!-- Metallic Sci-Fi Gradient for Wordmark -->
    <linearGradient id="edithWordmarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#BAE6FD" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Subtitle Glow Gradient -->
    <linearGradient id="edithSubGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="edithLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left: Arc Reactor Emblem (Center at x=32, y=32, r=26) -->
  <g transform="translate(6, 6) scale(0.52)">
    <!-- Outer Rings -->
    <circle cx="50" cy="50" r="48" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6" fill="none" />
    <circle cx="50" cy="50" r="44" stroke="#7DD3FC" stroke-width="1.2" stroke-dasharray="22 6" opacity="0.75" fill="none" />
    <circle cx="50" cy="50" r="41" fill="#0A1628" stroke="#38BDF8" stroke-width="1.6" />

    <!-- 10 Power Windows -->
    <circle cx="50" cy="50" r="38" stroke="#00D2FF" stroke-width="3" stroke-dasharray="7 5.56" fill="none" />
    <circle cx="50" cy="50" r="38" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="7 5.56" fill="none" opacity="0.85" />

    <!-- Inner Mechanical Collar -->
    <circle cx="50" cy="50" r="28" fill="#040A14" stroke="#7DD3FC" stroke-width="1.2" />
    <circle cx="50" cy="50" r="24" stroke="#0284C7" stroke-width="0.8" stroke-dasharray="2 3" fill="none" opacity="0.8" />

    <!-- Inverted Triangle Core -->
    <polygon points="31,34.5 69,34.5 50,67.5" fill="#071221" stroke="#38BDF8" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="34,36.5 66,36.5 50,64" fill="#00D2FF" stroke="#BAE6FD" stroke-width="0.9" stroke-linejoin="round" />
    <polygon points="39,39.5 61,39.5 50,58.5" fill="#FFFFFF" opacity="0.95" />
    <circle cx="50" cy="46" r="3.2" fill="#FFFFFF" />

    <!-- Horizontal Lens Flare Filament -->
    <line x1="4" y1="50" x2="96" y2="50" stroke="#BAE6FD" stroke-width="0.9" opacity="0.7" />
    <line x1="20" y1="50" x2="80" y2="50" stroke="#FFFFFF" stroke-width="1.6" opacity="0.95" />
  </g>

  <!-- Right: Typography matching the master design sheet -->
  <text
    x="68"
    y="34"
    fill="url(#edithWordmarkGrad)"
    filter="url(#edithLogoGlow)"
    font-family="'Michroma', 'Syncopate', -apple-system, BlinkMacSystemFont, sans-serif"
    font-size="25"
    font-weight="800"
    letter-spacing="4.5"
  >
    EDITH
  </text>
  <text
    x="69"
    y="49"
    fill="url(#edithSubGrad)"
    opacity="0.9"
    font-family="'Inter', -apple-system, sans-serif"
    font-size="8"
    font-weight="700"
    letter-spacing="2.6"
  >
    YOUR DEVELOPMENT WORKSPACE
  </text>
</svg>
