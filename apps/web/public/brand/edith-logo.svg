<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" fill="none">
  <defs>
    <linearGradient id="edithLogoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <radialGradient id="edithLogoPlasma" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#BAE6FD" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="90%" stop-color="#0284C7" />
    </radialGradient>
    <filter id="edithLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left: Arc Reactor Emblem (Center at x=28, y=28, r=22) -->
  <g>
    <!-- Outer Rings -->
    <circle cx="28" cy="28" r="22" stroke="url(#edithLogoCyan)" stroke-width="1.2" fill="none" opacity="0.9" />
    <circle cx="28" cy="28" r="19.5" stroke="#030914" stroke-width="3" fill="none" stroke-dasharray="10 3" />
    <circle cx="28" cy="28" r="19.5" stroke="url(#edithLogoCyan)" stroke-width="0.8" fill="none" stroke-dasharray="10 3" />
    <circle cx="28" cy="28" r="15" stroke="url(#edithLogoCyan)" stroke-width="0.7" opacity="0.8" />
    
    <!-- Inner Chamber -->
    <circle cx="28" cy="28" r="12" fill="#071322" stroke="url(#edithLogoCyan)" stroke-width="1" />
    
    <!-- Central Inverted Triangle Core -->
    <g filter="url(#edithLogoGlow)">
      <polygon points="17,20 39,20 28,39" fill="url(#edithLogoPlasma)" stroke="url(#edithLogoCyan)" stroke-width="1.2" stroke-linejoin="round" />
      <circle cx="28" cy="26" r="2.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Right: Typography -->
  <text
    x="62"
    y="31"
    fill="url(#edithLogoCyan)"
    filter="url(#edithLogoGlow)"
    font-family="'Poppins', 'Inter', -apple-system, sans-serif"
    font-size="23"
    font-weight="800"
    letter-spacing="4"
  >
    EDITH
  </text>
  <text
    x="63"
    y="44"
    fill="#BAE6FD"
    opacity="0.8"
    font-family="'Poppins', 'Inter', sans-serif"
    font-size="7.5"
    font-weight="600"
    letter-spacing="2.2"
  >
    YOUR DEVELOPMENT WORKSPACE
  </text>
</svg>
