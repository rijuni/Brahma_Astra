<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" fill="none">
  <defs>
    <linearGradient id="edithWordmarkCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#BAE6FD" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="edithWordmarkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- EDITH Primary Wordmark -->
  <text
    x="140"
    y="40"
    text-anchor="middle"
    fill="url(#edithWordmarkCyan)"
    filter="url(#edithWordmarkGlow)"
    font-family="'Poppins', 'Inter', -apple-system, sans-serif"
    font-size="36"
    font-weight="800"
    letter-spacing="6"
  >
    EDITH
  </text>

  <!-- Sub-Tagline -->
  <text
    x="140"
    y="58"
    text-anchor="middle"
    fill="#BAE6FD"
    opacity="0.85"
    font-family="'Poppins', 'Inter', sans-serif"
    font-size="8.5"
    font-weight="600"
    letter-spacing="3.5"
  >
    YOUR DEVELOPMENT WORKSPACE
  </text>
</svg>
