<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" fill="none">
  <defs>
    <linearGradient id="fridayLogoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5A7" />
      <stop offset="35%" stop-color="#F6C87A" />
      <stop offset="70%" stop-color="#D49A3E" />
      <stop offset="100%" stop-color="#9A6B1F" />
    </linearGradient>
    <radialGradient id="fridayLogoPlasma" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFF3D1" />
      <stop offset="60%" stop-color="#F6C87A" />
      <stop offset="90%" stop-color="#D97706" />
    </radialGradient>
    <filter id="fridayLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left: Arc Reactor Emblem (Center at x=28, y=28, r=22) -->
  <g>
    <!-- Outer Rings -->
    <circle cx="28" cy="28" r="22" stroke="url(#fridayLogoGold)" stroke-width="1.2" fill="none" opacity="0.9" />
    <circle cx="28" cy="28" r="19.5" stroke="#0E0A05" stroke-width="3" fill="none" stroke-dasharray="10 3" />
    <circle cx="28" cy="28" r="19.5" stroke="url(#fridayLogoGold)" stroke-width="0.8" fill="none" stroke-dasharray="10 3" />
    <circle cx="28" cy="28" r="15" stroke="url(#fridayLogoGold)" stroke-width="0.7" opacity="0.8" />
    
    <!-- Inner Chamber -->
    <circle cx="28" cy="28" r="12" fill="#18130B" stroke="url(#fridayLogoGold)" stroke-width="1" />
    
    <!-- Central Inverted Triangle Core -->
    <g filter="url(#fridayLogoGlow)">
      <polygon points="17,20 39,20 28,39" fill="url(#fridayLogoPlasma)" stroke="url(#fridayLogoGold)" stroke-width="1.2" stroke-linejoin="round" />
      <circle cx="28" cy="26" r="2.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Right: Typography -->
  <text
    x="62"
    y="31"
    fill="url(#fridayLogoGold)"
    filter="url(#fridayLogoGlow)"
    font-family="'Poppins', 'Inter', -apple-system, sans-serif"
    font-size="23"
    font-weight="800"
    letter-spacing="3.5"
  >
    FRIDAY
  </text>
  <text
    x="63"
    y="44"
    fill="#FFE5A7"
    opacity="0.8"
    font-family="'Poppins', 'Inter', sans-serif"
    font-size="7.5"
    font-weight="600"
    letter-spacing="2.2"
  >
    YOUR PERSONAL AI PLATFORM
  </text>
</svg>
