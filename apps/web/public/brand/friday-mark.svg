<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Metallic Gold & Amber Gradients -->
    <linearGradient id="fridayGoldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5A7" />
      <stop offset="35%" stop-color="#F6C87A" />
      <stop offset="70%" stop-color="#D49A3E" />
      <stop offset="100%" stop-color="#9A6B1F" />
    </linearGradient>
    <linearGradient id="fridayDarkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2218" />
      <stop offset="50%" stop-color="#18130B" />
      <stop offset="100%" stop-color="#0E0A05" />
    </linearGradient>
    <radialGradient id="fridayPlasmaCore" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFF3D1" />
      <stop offset="55%" stop-color="#F6C87A" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="fridayAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#B45309" stop-opacity="0.3" />
      <stop offset="75%" stop-color="#1E1B3D" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0B0F1A" stop-opacity="0" />
    </radialGradient>
    <filter id="fridayGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Gold Core Aura -->
  <circle cx="50" cy="50" r="46" fill="url(#fridayAmbientGlow)" />

  <!-- Vertical & Horizontal Lens Flare Filaments -->
  <line x1="50" y1="4" x2="50" y2="96" stroke="#FFE5A7" stroke-width="0.8" opacity="0.6" />
  <line x1="50" y1="20" x2="50" y2="80" stroke="#FFFFFF" stroke-width="1.2" opacity="0.85" filter="url(#fridayGlow)" />
  <line x1="8" y1="50" x2="92" y2="50" stroke="#F6C87A" stroke-width="0.6" opacity="0.4" />

  <!-- Outer Machined Reactor Ring (Segmented) -->
  <circle cx="50" cy="50" r="44" stroke="url(#fridayGoldMetallic)" stroke-width="1.8" fill="none" opacity="0.9" />
  <circle cx="50" cy="50" r="41" stroke="#0E0A05" stroke-width="4.5" fill="none" stroke-dasharray="18 4" />
  <circle cx="50" cy="50" r="41" stroke="url(#fridayGoldMetallic)" stroke-width="1.2" fill="none" stroke-dasharray="18 4" />

  <!-- Precision Etched Caliper Track -->
  <circle cx="50" cy="50" r="36" stroke="#D49A3E" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.75" />
  <circle cx="50" cy="50" r="33" stroke="url(#fridayGoldMetallic)" stroke-width="0.9" opacity="0.85" />

  <!-- 10 Peripheral Bolt / Alignment Lugs -->
  <g fill="#FFE5A7">
    <circle cx="50" cy="9" r="1.2" />
    <circle cx="74" cy="17" r="1.2" />
    <circle cx="89" cy="38" r="1.2" />
    <circle cx="84" cy="65" r="1.2" />
    <circle cx="63" cy="86" r="1.2" />
    <circle cx="37" cy="86" r="1.2" />
    <circle cx="16" cy="65" r="1.2" />
    <circle cx="11" cy="38" r="1.2" />
    <circle cx="26" cy="17" r="1.2" />
    <circle cx="50" cy="91" r="1.2" />
  </g>

  <!-- Mid-Chamber Mechanical Collar -->
  <circle cx="50" cy="50" r="27" fill="url(#fridayDarkSteel)" stroke="url(#fridayGoldMetallic)" stroke-width="1.5" />
  <circle cx="50" cy="50" r="23" stroke="#F59E0B" stroke-width="0.7" stroke-dasharray="4 2" opacity="0.8" />

  <!-- Central Inverted Equilateral Triangle Arc Reactor Core -->
  <g filter="url(#fridayGlow)">
    <!-- Outer Inverted Triangle Housing -->
    <polygon points="28,34 72,34 50,72" fill="#18130B" stroke="url(#fridayGoldMetallic)" stroke-width="2.2" stroke-linejoin="round" />
    
    <!-- Luminous Fusion Plasma Core -->
    <polygon points="32,36 68,36 50,68" fill="url(#fridayPlasmaCore)" />
    
    <!-- Inner Radiant Core Ring -->
    <polygon points="38,40 62,40 50,61" fill="#FFFFFF" opacity="0.95" />
    
    <!-- Ultra-intense Center Point -->
    <circle cx="50" cy="48" r="4.5" fill="#FFFFFF" />
    <circle cx="50" cy="48" r="7.5" stroke="#FFE5A7" stroke-width="1" fill="none" opacity="0.85" />
  </g>

  <!-- Ambient Energy Sparks -->
  <circle cx="36" cy="24" r="0.8" fill="#FFE5A7" opacity="0.8" />
  <circle cx="66" cy="22" r="0.7" fill="#FFE5A7" opacity="0.75" />
  <circle cx="78" cy="52" r="0.8" fill="#FFE5A7" opacity="0.8" />
  <circle cx="24" cy="60" r="0.7" fill="#FFE5A7" opacity="0.75" />
</svg>
