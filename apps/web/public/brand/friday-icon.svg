<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="fridayIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E160C" />
      <stop offset="50%" stop-color="#0E0A05" />
      <stop offset="100%" stop-color="#050301" />
    </linearGradient>
    <linearGradient id="fridayIconRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5A7" />
      <stop offset="50%" stop-color="#F6C87A" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <radialGradient id="fridayIconPlasma" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFF3D1" />
      <stop offset="60%" stop-color="#F6C87A" />
      <stop offset="90%" stop-color="#D97706" />
    </radialGradient>
    <filter id="fridayIconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#fridayIconBg)" stroke="url(#fridayIconRim)" stroke-width="1.8" />
  <rect x="6" y="6" width="116" height="116" rx="26" stroke="#F59E0B" stroke-width="0.8" opacity="0.3" fill="none" />

  <!-- Ambient Gold Backlight -->
  <circle cx="64" cy="64" r="42" fill="#F59E0B" opacity="0.18" filter="url(#fridayIconGlow)" />

  <!-- Gold Arc Reactor Centered (cx=64, cy=64) -->
  <g>
    <!-- Outer Machined Rings -->
    <circle cx="64" cy="64" r="40" stroke="url(#fridayIconRim)" stroke-width="1.5" fill="none" opacity="0.9" />
    <circle cx="64" cy="64" r="36" stroke="#0E0A05" stroke-width="4.5" fill="none" stroke-dasharray="16 4" />
    <circle cx="64" cy="64" r="36" stroke="url(#fridayIconRim)" stroke-width="1" fill="none" stroke-dasharray="16 4" />
    <circle cx="64" cy="64" r="28" stroke="url(#fridayIconRim)" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.7" />

    <!-- Inner Collar -->
    <circle cx="64" cy="64" r="23" fill="#18130B" stroke="url(#fridayIconRim)" stroke-width="1.4" />

    <!-- Inverted Triangle Plasma Core -->
    <g filter="url(#fridayIconGlow)">
      <polygon points="44,50 84,50 64,84" fill="#0E0A05" stroke="url(#fridayIconRim)" stroke-width="2" stroke-linejoin="round" />
      <polygon points="48,52 80,52 64,80" fill="url(#fridayIconPlasma)" />
      <polygon points="54,55 74,55 64,73" fill="#FFFFFF" opacity="0.95" />
      <circle cx="64" cy="62" r="4" fill="#FFFFFF" />
    </g>
  </g>
</svg>
