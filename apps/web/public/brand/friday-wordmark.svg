<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" fill="none">
  <defs>
    <linearGradient id="fridayWordmarkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFE5A7" />
      <stop offset="60%" stop-color="#F6C87A" />
      <stop offset="100%" stop-color="#D49A3E" />
    </linearGradient>
    <filter id="wordmarkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- FRIDAY Primary Wordmark -->
  <text
    x="140"
    y="40"
    text-anchor="middle"
    fill="url(#fridayWordmarkGold)"
    filter="url(#wordmarkGlow)"
    font-family="'Poppins', 'Inter', -apple-system, sans-serif"
    font-size="36"
    font-weight="800"
    letter-spacing="5"
  >
    FRIDAY
  </text>

  <!-- Sub-Tagline -->
  <text
    x="140"
    y="58"
    text-anchor="middle"
    fill="#FFE5A7"
    opacity="0.85"
    font-family="'Poppins', 'Inter', sans-serif"
    font-size="8.5"
    font-weight="600"
    letter-spacing="3.5"
  >
    YOUR PERSONAL AI PLATFORM
  </text>
</svg>
