<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Metallic Steel & Cyan Gradients matching EDITH master sheet -->
    <linearGradient id="emSteelBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="25%" stop-color="#7DD3FC" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="85%" stop-color="#0B192C" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="emDarkArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="emCoilCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#BAE6FD" />
      <stop offset="65%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <radialGradient id="emFusionCore" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E0F2FE" />
      <stop offset="55%" stop-color="#38BDF8" />
      <stop offset="85%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#082F49" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emAmbientPlasma" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#0284C7" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#0369A1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <filter id="emGlowIntense" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur1" />
      <feGaussianBlur stdDeviation="4.8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="emFlareFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Layer 0: Ambient Energy Field -->
  <circle cx="50" cy="50" r="48" fill="url(#emAmbientPlasma)" />

  <!-- Layer 1: Horizontal Laser Lens Flare Beam -->
  <g filter="url(#emFlareFilter)">
    <line x1="2" y1="50" x2="98" y2="50" stroke="#38BDF8" stroke-width="0.75" opacity="0.65" />
    <line x1="14" y1="50" x2="86" y2="50" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9" />
    <line x1="50" y1="6" x2="50" y2="94" stroke="#38BDF8" stroke-width="0.5" opacity="0.35" />
  </g>

  <!-- Layer 2: Outermost HUD Calibration Rings -->
  <circle cx="50" cy="50" r="46.5" stroke="#38BDF8" stroke-width="0.5" stroke-dasharray="1.5 3" opacity="0.6" fill="none" />
  <circle cx="50" cy="50" r="44" stroke="#7DD3FC" stroke-width="0.8" stroke-dasharray="22 6" opacity="0.75" fill="none" />
  <line x1="50" y1="2" x2="50" y2="6" stroke="#BAE6FD" stroke-width="1.2" />
  <line x1="50" y1="94" x2="50" y2="98" stroke="#BAE6FD" stroke-width="1.2" />
  <line x1="2" y1="50" x2="6" y2="50" stroke="#BAE6FD" stroke-width="1.2" />
  <line x1="94" y1="50" x2="98" y2="50" stroke="#BAE6FD" stroke-width="1.2" />

  <!-- Layer 3: Main Outer Armor Casing Ring -->
  <circle cx="50" cy="50" r="41" fill="url(#emDarkArmor)" stroke="url(#emSteelBezel)" stroke-width="1.4" />
  <circle cx="50" cy="50" r="40" stroke="#00D2FF" stroke-width="0.5" opacity="0.4" fill="none" />

  <!-- Layer 4: The 10 Segmented Arc Reactor Power Chambers (36 deg intervals) -->
  <g>
    <!-- 0 deg -->
    <g transform="rotate(0 50 50)">
      <rect x="46.2" y="11.2" width="7.6" height="6.8" rx="1.2" fill="url(#emCoilCyan)" filter="url(#emGlowIntense)" opacity="0.95" />
      <line x1="47.2" y1="13.2" x2="52.8" y2="13.2" stroke="#FFFFFF" stroke-width="0.5" opacity="0.85" />
      <path d="M 44.5 9.5 L 45.8 19 L 47 19 L 46.2 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <path d="M 55.5 9.5 L 54.2 19 L 53 19 L 53.8 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <circle cx="50" cy="9.8" r="0.9" fill="#E0F2FE" />
    </g>
    <!-- 36 deg -->
    <g transform="rotate(36 50 50)">
      <rect x="46.2" y="11.2" width="7.6" height="6.8" rx="1.2" fill="url(#emCoilCyan)" filter="url(#emGlowIntense)" opacity="0.95" />
      <line x1="47.2" y1="13.2" x2="52.8" y2="13.2" stroke="#FFFFFF" stroke-width="0.5" opacity="0.85" />
      <path d="M 44.5 9.5 L 45.8 19 L 47 19 L 46.2 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <path d="M 55.5 9.5 L 54.2 19 L 53 19 L 53.8 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <circle cx="50" cy="9.8" r="0.9" fill="#E0F2FE" />
    </g>
    <!-- 72 deg -->
    <g transform="rotate(72 50 50)">
      <rect x="46.2" y="11.2" width="7.6" height="6.8" rx="1.2" fill="url(#emCoilCyan)" filter="url(#emGlowIntense)" opacity="0.95" />
      <line x1="47.2" y1="13.2" x2="52.8" y2="13.2" stroke="#FFFFFF" stroke-width="0.5" opacity="0.85" />
      <path d="M 44.5 9.5 L 45.8 19 L 47 19 L 46.2 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <path d="M 55.5 9.5 L 54.2 19 L 53 19 L 53.8 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <circle cx="50" cy="9.8" r="0.9" fill="#E0F2FE" />
    </g>
    <!-- 108 deg -->
    <g transform="rotate(108 50 50)">
      <rect x="46.2" y="11.2" width="7.6" height="6.8" rx="1.2" fill="url(#emCoilCyan)" filter="url(#emGlowIntense)" opacity="0.95" />
      <line x1="47.2" y1="13.2" x2="52.8" y2="13.2" stroke="#FFFFFF" stroke-width="0.5" opacity="0.85" />
      <path d="M 44.5 9.5 L 45.8 19 L 47 19 L 46.2 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <path d="M 55.5 9.5 L 54.2 19 L 53 19 L 53.8 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <circle cx="50" cy="9.8" r="0.9" fill="#E0F2FE" />
    </g>
    <!-- 144 deg -->
    <g transform="rotate(144 50 50)">
      <rect x="46.2" y="11.2" width="7.6" height="6.8" rx="1.2" fill="url(#emCoilCyan)" filter="url(#emGlowIntense)" opacity="0.95" />
      <line x1="47.2" y1="13.2" x2="52.8" y2="13.2" stroke="#FFFFFF" stroke-width="0.5" opacity="0.85" />
      <path d="M 44.5 9.5 L 45.8 19 L 47 19 L 46.2 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <path d="M 55.5 9.5 L 54.2 19 L 53 19 L 53.8 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <circle cx="50" cy="9.8" r="0.9" fill="#E0F2FE" />
    </g>
    <!-- 180 deg -->
    <g transform="rotate(180 50 50)">
      <rect x="46.2" y="11.2" width="7.6" height="6.8" rx="1.2" fill="url(#emCoilCyan)" filter="url(#emGlowIntense)" opacity="0.95" />
      <line x1="47.2" y1="13.2" x2="52.8" y2="13.2" stroke="#FFFFFF" stroke-width="0.5" opacity="0.85" />
      <path d="M 44.5 9.5 L 45.8 19 L 47 19 L 46.2 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <path d="M 55.5 9.5 L 54.2 19 L 53 19 L 53.8 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <circle cx="50" cy="9.8" r="0.9" fill="#E0F2FE" />
    </g>
    <!-- 216 deg -->
    <g transform="rotate(216 50 50)">
      <rect x="46.2" y="11.2" width="7.6" height="6.8" rx="1.2" fill="url(#emCoilCyan)" filter="url(#emGlowIntense)" opacity="0.95" />
      <line x1="47.2" y1="13.2" x2="52.8" y2="13.2" stroke="#FFFFFF" stroke-width="0.5" opacity="0.85" />
      <path d="M 44.5 9.5 L 45.8 19 L 47 19 L 46.2 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <path d="M 55.5 9.5 L 54.2 19 L 53 19 L 53.8 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <circle cx="50" cy="9.8" r="0.9" fill="#E0F2FE" />
    </g>
    <!-- 252 deg -->
    <g transform="rotate(252 50 50)">
      <rect x="46.2" y="11.2" width="7.6" height="6.8" rx="1.2" fill="url(#emCoilCyan)" filter="url(#emGlowIntense)" opacity="0.95" />
      <line x1="47.2" y1="13.2" x2="52.8" y2="13.2" stroke="#FFFFFF" stroke-width="0.5" opacity="0.85" />
      <path d="M 44.5 9.5 L 45.8 19 L 47 19 L 46.2 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <path d="M 55.5 9.5 L 54.2 19 L 53 19 L 53.8 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <circle cx="50" cy="9.8" r="0.9" fill="#E0F2FE" />
    </g>
    <!-- 288 deg -->
    <g transform="rotate(288 50 50)">
      <rect x="46.2" y="11.2" width="7.6" height="6.8" rx="1.2" fill="url(#emCoilCyan)" filter="url(#emGlowIntense)" opacity="0.95" />
      <line x1="47.2" y1="13.2" x2="52.8" y2="13.2" stroke="#FFFFFF" stroke-width="0.5" opacity="0.85" />
      <path d="M 44.5 9.5 L 45.8 19 L 47 19 L 46.2 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <path d="M 55.5 9.5 L 54.2 19 L 53 19 L 53.8 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <circle cx="50" cy="9.8" r="0.9" fill="#E0F2FE" />
    </g>
    <!-- 324 deg -->
    <g transform="rotate(324 50 50)">
      <rect x="46.2" y="11.2" width="7.6" height="6.8" rx="1.2" fill="url(#emCoilCyan)" filter="url(#emGlowIntense)" opacity="0.95" />
      <line x1="47.2" y1="13.2" x2="52.8" y2="13.2" stroke="#FFFFFF" stroke-width="0.5" opacity="0.85" />
      <path d="M 44.5 9.5 L 45.8 19 L 47 19 L 46.2 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <path d="M 55.5 9.5 L 54.2 19 L 53 19 L 53.8 9.5 Z" fill="#334155" stroke="#0F172A" stroke-width="0.3" />
      <circle cx="50" cy="9.8" r="0.9" fill="#E0F2FE" />
    </g>
  </g>

  <!-- Layer 5: Inner Caliper & Notch Ring -->
  <circle cx="50" cy="50" r="29.5" fill="#071221" stroke="url(#emSteelBezel)" stroke-width="1.2" />
  <circle cx="50" cy="50" r="26.8" stroke="#38BDF8" stroke-width="0.7" stroke-dasharray="2 3" opacity="0.85" fill="none" />
  <circle cx="50" cy="50" r="24" stroke="#00D2FF" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.55" fill="none" />

  <!-- Layer 6: Mid-Chamber Containment Ring -->
  <circle cx="50" cy="50" r="21.5" fill="#040C1A" stroke="url(#emSteelBezel)" stroke-width="1" />
  <circle cx="50" cy="50" r="19.5" stroke="#38BDF8" stroke-width="0.5" opacity="0.6" fill="none" />

  <!-- Layer 7: Central Inverted Equilateral Triangle Arc Reactor Core -->
  <g filter="url(#emGlowIntense)">
    <polygon points="31,34.5 69,34.5 50,67.5" fill="#0B192C" stroke="url(#emSteelBezel)" stroke-width="1.8" stroke-linejoin="round" />
    <polygon points="33.5,36 66.5,36 50,64.5" fill="url(#emFusionCore)" stroke="#38BDF8" stroke-width="0.8" stroke-linejoin="round" />
    <polygon points="38.5,39 61.5,39 50,59" fill="#FFFFFF" opacity="0.95" />
    <circle cx="50" cy="46" r="3.8" fill="#FFFFFF" />
    <circle cx="50" cy="46" r="6.2" stroke="#BAE6FD" stroke-width="0.8" fill="none" opacity="0.8" />
  </g>

  <!-- Layer 8: Ambient Plasma Sparks -->
  <circle cx="37" cy="27" r="0.7" fill="#BAE6FD" opacity="0.8" />
  <circle cx="63" cy="27" r="0.7" fill="#BAE6FD" opacity="0.8" />
  <circle cx="72" cy="58" r="0.6" fill="#7DD3FC" opacity="0.75" />
  <circle cx="28" cy="58" r="0.6" fill="#7DD3FC" opacity="0.75" />
</svg>
