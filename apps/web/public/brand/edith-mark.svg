<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Metallic Electric Blue & Cyan Gradients -->
    <linearGradient id="edithCyanMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="edithDarkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1E34" />
      <stop offset="50%" stop-color="#071322" />
      <stop offset="100%" stop-color="#030914" />
    </linearGradient>
    <radialGradient id="edithPlasmaCore" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#BAE6FD" />
      <stop offset="55%" stop-color="#38BDF8" />
      <stop offset="85%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0C4A6E" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="edithAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#0369A1" stop-opacity="0.3" />
      <stop offset="75%" stop-color="#1E1B3D" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0B0F1A" stop-opacity="0" />
    </radialGradient>
    <filter id="edithGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Cyan Core Aura -->
  <circle cx="50" cy="50" r="46" fill="url(#edithAmbientGlow)" />

  <!-- Horizontal & Vertical Laser Lens Flare Filaments -->
  <line x1="4" y1="50" x2="96" y2="50" stroke="#BAE6FD" stroke-width="0.8" opacity="0.6" />
  <line x1="16" y1="50" x2="84" y2="50" stroke="#FFFFFF" stroke-width="1.2" opacity="0.85" filter="url(#edithGlow)" />
  <line x1="50" y1="8" x2="50" y2="92" stroke="#38BDF8" stroke-width="0.6" opacity="0.4" />

  <!-- Outer Machined Reactor Ring (Segmented) -->
  <circle cx="50" cy="50" r="44" stroke="url(#edithCyanMetallic)" stroke-width="1.8" fill="none" opacity="0.9" />
  <circle cx="50" cy="50" r="41" stroke="#030914" stroke-width="4.5" fill="none" stroke-dasharray="18 4" />
  <circle cx="50" cy="50" r="41" stroke="url(#edithCyanMetallic)" stroke-width="1.2" fill="none" stroke-dasharray="18 4" />

  <!-- Precision Etched Caliper Track -->
  <circle cx="50" cy="50" r="36" stroke="#0284C7" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.75" />
  <circle cx="50" cy="50" r="33" stroke="url(#edithCyanMetallic)" stroke-width="0.9" opacity="0.85" />

  <!-- 10 Peripheral Bolt / Alignment Lugs -->
  <g fill="#E0F2FE">
    <circle cx="50" cy="9" r="1.2" />
    <circle cx="74" cy="17" r="1.2" />
    <circle cx="89" cy="38" r="1.2" />
    <circle cx="84" cy="65" r="1.2" />
    <circle cx="63" cy="86" r="1.2" />
    <circle cx="37" cy="86" r="1.2" />
    <circle cx="16" cy="65" r="1.2" />
    <circle cx="11" cy="38" r="1.2" />
    <circle cx="26" cy="17" r="1.2" />
    <circle cx="50" cy="91" r="1.2" />
  </g>

  <!-- Mid-Chamber Mechanical Collar -->
  <circle cx="50" cy="50" r="27" fill="url(#edithDarkSteel)" stroke="url(#edithCyanMetallic)" stroke-width="1.5" />
  <circle cx="50" cy="50" r="23" stroke="#00D2FF" stroke-width="0.7" stroke-dasharray="4 2" opacity="0.8" />

  <!-- Central Inverted Equilateral Triangle Arc Reactor Core -->
  <g filter="url(#edithGlow)">
    <!-- Outer Inverted Triangle Housing -->
    <polygon points="28,34 72,34 50,72" fill="#071322" stroke="url(#edithCyanMetallic)" stroke-width="2.2" stroke-linejoin="round" />
    
    <!-- Luminous Fusion Plasma Core -->
    <polygon points="32,36 68,36 50,68" fill="url(#edithPlasmaCore)" />
    
    <!-- Inner Radiant Core Ring -->
    <polygon points="38,40 62,40 50,61" fill="#FFFFFF" opacity="0.95" />
    
    <!-- Ultra-intense Center Point -->
    <circle cx="50" cy="48" r="4.5" fill="#FFFFFF" />
    <circle cx="50" cy="48" r="7.5" stroke="#BAE6FD" stroke-width="1" fill="none" opacity="0.85" />
  </g>

  <!-- Ambient Energy Sparks -->
  <circle cx="36" cy="24" r="0.8" fill="#E0F2FE" opacity="0.8" />
  <circle cx="66" cy="22" r="0.7" fill="#E0F2FE" opacity="0.75" />
  <circle cx="78" cy="52" r="0.8" fill="#E0F2FE" opacity="0.8" />
  <circle cx="24" cy="60" r="0.7" fill="#E0F2FE" opacity="0.75" />
</svg>
